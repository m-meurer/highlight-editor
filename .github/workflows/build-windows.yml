# Builds the Windows installer (Highlight-Editor-Setup-<version>.exe).
#
# It has to run on Windows: ffmpeg-static downloads the ffmpeg binary for the
# machine that runs `npm ci`, so a Mac or Linux build would ship the wrong one.
#
# - Pull requests and manual runs: the installer is uploaded as a workflow
#   artifact (Actions tab -> the run -> "Artifacts").
# - Pushing a version tag (e.g. v0.2.0): it is also attached to a GitHub
#   Release for that tag.
name: Build Windows installer

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the bundled ffmpeg is the Windows build
        shell: bash
        run: |
          test -f node_modules/ffmpeg-static/ffmpeg.exe
          node_modules/ffmpeg-static/ffmpeg.exe -hide_banner -version | head -1
          node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe -hide_banner -version | head -1

      - name: Build installer
        run: npm run build && npx electron-builder --win --x64 --publish never
        env:
          # No code-signing certificate yet: skip auto-discovery of one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Highlight-Editor-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
