<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- .hlp document icon: a page carrying the app icon, so projects are
       recognizable as Highlight Editor files. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="tileshadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="tile"><rect x="292" y="300" width="440" height="440" rx="99"/></clipPath>
  </defs>
  <path filter="url(#shadow)" fill="url(#page)" stroke="#d5d9e0" stroke-width="4"
        d="M226 72 H640 L830 262 V912 a40 40 0 0 1 -40 40 H226 a40 40 0 0 1 -40 -40 V112 a40 40 0 0 1 40 -40 Z"/>
  <path fill="#dfe3e9" d="M640 72 V222 a40 40 0 0 0 40 40 H830 Z"/>
  <!-- the app icon, scaled onto the page -->
  <g filter="url(#tileshadow)">
    <rect x="292" y="300" width="440" height="440" rx="99" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)" fill="none" stroke="#39d98a" stroke-opacity="0.28" stroke-width="8">
    <line x1="512" y1="300" x2="512" y2="740"/>
    <circle cx="512" cy="520" r="80"/>
    <rect x="270" y="423" width="91" height="194"/>
    <rect x="663" y="423" width="91" height="194"/>
  </g>
  <circle cx="512" cy="520" r="102" fill="#39d98a"/>
  <path d="M482 466 L573 520 L482 574 Z" fill="#0f1115"/>
  <text x="508" y="866" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="96" letter-spacing="6" fill="#2a2f3a">HLP</text>
</svg>
